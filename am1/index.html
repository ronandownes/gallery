<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb {
      width: min(320px, 80vw);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }
    .thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <a href="/gallery/index.html" download>
    <div class="thumb">
      <img src="thumbs/001.webp" alt="">
    </div>
  </a>
</body>
</html>
