<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>am2 - Viewer</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #1a1a1a;
  color: #e8e8e8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body { display: flex; }
button, input, select { font: inherit; }
body.toc-hidden .toc-sidebar { margin-left: -320px; }
.toc-toggle-fixed {
  position: fixed; top: 52px; left: 0; z-index: 2200;
  border: none; background: #7f5cff; color: white;
  padding: 8px 7px; border-radius: 0 6px 6px 0; cursor: pointer;
  box-shadow: 2px 2px 10px rgba(0,0,0,.25);
}
.toc-sidebar {
  width: 320px; flex-shrink: 0; background: #222; border-right: 1px solid #333;
  display: flex; flex-direction: column; transition: margin-left .22s ease; z-index: 1500;
}
.toc-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #333; }
.toc-header h2 { margin: 0; font-size: 14px; }
.toc-close { border: 1px solid #444; background: #2d2d2d; color: #ddd; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; }
.toc-content { flex: 1; overflow: auto; padding: 6px; }
.toc-chapter { margin-bottom: 4px; border-radius: 6px; overflow: hidden; }
.toc-chapter-header { display: flex; align-items: center; gap: 6px; background: #2c2c2c; padding: 7px 8px; cursor: pointer; }
.toc-chapter-header:hover, .toc-section:hover { background: #343434; }
.chapter-expand { width: 12px; color: #a89aff; transition: transform .15s; font-size: 10px; }
.toc-chapter.expanded .chapter-expand { transform: rotate(90deg); }
.chapter-number { min-width: 32px; color: #a89aff; font-weight: 700; font-size: 11px; }
.toc-chapter-title { font-size: 11px; line-height: 1.3; flex: 1; }
.toc-sections { display: none; background: #252525; }
.toc-chapter.expanded .toc-sections { display: block; }
.toc-section { display: flex; gap: 6px; cursor: pointer; padding: 6px 8px 6px 30px; }
.toc-section.active { background: #3a3a3a; }
.section-number { min-width: 28px; color: #9a9a9a; font-size: 10px; }
.toc-no-data { color: #8f8f8f; padding: 16px; font-size: 12px; }

.viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.controls {
  height: 42px; min-height: 42px; display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  background: #222; border-bottom: 1px solid #333; z-index: 1000;
}
.controls-left, .controls-right { display: flex; align-items: center; gap: 6px; }
.controls-right { margin-left: auto; }
.toolbar-btn {
  border: 1px solid #444; background: #303030; color: #e8e8e8; border-radius: 6px;
  min-width: 32px; height: 30px; padding: 0 8px; cursor: pointer;
}
.toolbar-btn:hover { background: #3a3a3a; }
.toolbar-btn.active { background: #7f5cff; border-color: #9b87ff; color: white; }
.sep { width: 1px; height: 18px; background: #444; }
.page-info { display: flex; align-items: center; gap: 3px; font-size: 12px; }
#current-page { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
#current-page:hover { background: #393939; }
.page-input-inline {
  width: 50px; padding: 3px 4px; text-align: center; border: 1px solid #7f5cff;
  border-radius: 4px; background: #181818; color: #fff;
}

.image-container { position: relative; flex: 1; overflow: auto; background: #1a1a1a; touch-action: none; }
.image-container.fit-height { display: flex; align-items: center; justify-content: center; }
.image-container.fit-height #page-image { height: 100%; width: auto; max-width: 100%; object-fit: contain; }
.image-container.fit-width #page-image { width: 100%; height: auto; object-fit: contain; }
#page-image {
  display: block; transform-origin: 50% 50%; box-shadow: 0 6px 22px rgba(0,0,0,.45);
  user-select: none; -webkit-user-drag: none;
}
.zoom-indicator {
  position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.65); color: white;
  border-radius: 4px; padding: 4px 8px; font-size: 11px; display: none; z-index: 900;
}

.teacher-pointer {
  position: absolute; width: 46px; height: 46px; border: 4px solid #9b4dff; border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(155,77,255,.18), 0 0 18px rgba(155,77,255,.28);
  transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 1300;
}
.teacher-pointer::after {
  content: ""; position: absolute; inset: 50% auto auto 50%; width: 10px; height: 10px;
  border-radius: 50%; background: #9b4dff; transform: translate(-50%, -50%);
}
.teacher-pointer.active { display: block; }

#ink-layer { position: absolute; inset: 0; z-index: 1200; display: none; touch-action: none; }
#ink-layer.active { display: block; cursor: crosshair; }

.reading-ruler { position: absolute; left: 0; width: 100%; height: 54px; display: none; z-index: 1100; pointer-events: none; }
.reading-ruler.active { display: block; }
.ruler-bar {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0, transparent 3px, rgba(120,75,0,.06) 3px, rgba(120,75,0,.06) 6px),
              linear-gradient(180deg, #dbb46f 0%, #d3a95d 10%, #c89745 45%, #c2913c 55%, #d0a65b 90%, #d9b46f 100%);
  border-top: 1px solid #8b6914; border-bottom: 2px solid #6f5210; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.ruler-edge { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(180deg, #9b7420, #7b5c16); }
.ruler-ticks { position: absolute; left: 0; right: 0; bottom: 6px; height: 20px; }
.ruler-tick { position: absolute; bottom: 0; width: 1px; background: #66480f; }
.ruler-tick.cm { height: 16px; width: 1.5px; }
.ruler-tick.half { height: 10px; }
.ruler-tick.mm { height: 6px; opacity: .7; }
.ruler-tick-label { position: absolute; bottom: 21px; transform: translateX(-50%); font-size: 8px; color: #5b3f0b; font-weight: 700; }

.lightbox {
  position: absolute; display: none; z-index: 1000; border: 2px solid rgba(255,220,100,.65);
  border-radius: 6px; box-shadow: 0 0 0 4000px rgba(0,0,0,.38);
}
.lightbox.active { display: block; }
.lightbox.focused { border-color: rgba(255,220,100,.95); }
.lb-handle {
  position: absolute; width: 16px; height: 16px; background: rgba(255,220,100,.82);
  border: 1px solid rgba(170,130,25,.9); border-radius: 4px; z-index: 1001;
}
.lb-handle.tl { top: -8px; left: -8px; cursor: nw-resize; }
.lb-handle.tr { top: -8px; right: -8px; cursor: ne-resize; }
.lb-handle.bl { bottom: -8px; left: -8px; cursor: sw-resize; }
.lb-handle.br { bottom: -8px; right: -8px; cursor: se-resize; }

.smart-nav {
  position: fixed; left: 50%; top: calc(100% - 96px); transform: translate(-50%, -50%);
  width: 56px; height: 56px; border: none; border-radius: 50%; background: rgba(255,255,255,.90);
  color: #222; box-shadow: 0 5px 18px rgba(0,0,0,.22); z-index: 2100; cursor: grab;
  user-select: none; touch-action: none;
}
.smart-nav.dragging { cursor: grabbing; }
.smart-nav span { font-size: 28px; font-weight: 700; line-height: 1; }

@media print {
  .toc-sidebar, .toc-toggle-fixed, .controls, .smart-nav, .teacher-pointer, #ink-layer,
  .reading-ruler, .lightbox, .zoom-indicator { display: none !important; }
  body, html { overflow: visible !important; background: white !important; }
  .viewer, .image-container { overflow: visible !important; display: block !important; }
  #page-image { width: 100% !important; height: auto !important; transform: none !important; box-shadow: none !important; }
}

@media (max-width: 700px) {
  .toc-sidebar { width: 270px; }
  body.toc-hidden .toc-sidebar { margin-left: -270px; }
  .toolbar-btn { min-width: 28px; height: 28px; }
  .smart-nav { width: 48px; height: 48px; }
  .smart-nav span { font-size: 24px; }
}
</style>
</head>
<body class="toc-hidden">
<button class="toc-toggle-fixed" id="toc-toggle-fixed" title="Contents">📖</button>

<div class="toc-sidebar">
  <div class="toc-header">
    <h2>Contents</h2>
    <button class="toc-close" id="toc-close">×</button>
  </div>
  <div class="toc-content" id="toc-content"></div>
</div>

<div class="viewer">
  <div class="controls">
    <div class="controls-left">
      <button class="toolbar-btn" id="toc-btn" title="Contents">☰</button>
      <span class="sep"></span>
      <button class="toolbar-btn active" id="fit-height" title="Fit height">↕</button>
      <button class="toolbar-btn" id="fit-width" title="Fit width">↔</button>
      <span class="sep"></span>
      <button class="toolbar-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="toolbar-btn" id="zoom-in" title="Zoom in">+</button>
      <span class="sep"></span>
      <span class="page-info">
        <span id="current-page" title="Go to page">1</span>
        <span>/</span>
        <span id="total-pages">0</span>
      </span>
    </div>

    <div class="controls-right">
      <button class="toolbar-btn" id="pointer-btn" title="Pointer">🟣</button>
      <button class="toolbar-btn" id="tool-ruler" title="Ruler">📏</button>
      <button class="toolbar-btn" id="tool-lightbox" title="Lightbox">🔦</button>
      <button class="toolbar-btn" id="tool-pen" title="Pen">✍</button>
      <button class="toolbar-btn" id="tool-undo" title="Undo ink">↶</button>
      <button class="toolbar-btn" id="tool-clear-ink" title="Clear ink">⌫</button>
      <span class="sep"></span>
      <button class="toolbar-btn" id="copy-link" title="Copy link">📎</button>
      <button class="toolbar-btn" id="print-btn" title="Print">🖨</button>
      <button class="toolbar-btn" id="fullscreen" title="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="image-container fit-height" id="image-container">
    <img id="page-image" src="" alt="Page">
    <canvas id="ink-layer"></canvas>
    <div class="teacher-pointer" id="teacher-pointer"></div>

    <div class="reading-ruler" id="reading-ruler">
      <div class="ruler-bar">
        <div class="ruler-ticks" id="ruler-ticks"></div>
        <div class="ruler-edge"></div>
      </div>
    </div>

    <div class="lightbox" id="lightbox">
      <div class="lb-handle tl" data-corner="tl"></div>
      <div class="lb-handle tr" data-corner="tr"></div>
      <div class="lb-handle bl" data-corner="bl"></div>
      <div class="lb-handle br" data-corner="br"></div>
    </div>

    <div class="zoom-indicator" id="zoom-indicator"></div>
  </div>
</div>

<button class="smart-nav" id="smart-nav" title="Drag to an edge, then click">
  <span id="smart-nav-icon">↓</span>
</button>

    if (!chapters.length) { container.innerHTML = '<div class="toc-no-data">No contents</div>'; return; }
    let html = "";
    chapters.forEach((ch, i) => {

      html += `

  function initLightbox() {
    const w = Math.round(imageContainer.clientWidth * 0.68), h = Math.round(imageContainer.clientHeight * 0.36);
    lightbox.w = Math.max(180, w); lightbox.h = Math.max(120, h);
    lightbox.x = Math.round((imageContainer.clientWidth - lightbox.w) / 2);
    lightbox.y = Math.round(imageContainer.scrollTop + imageContainer.clientHeight * 0.22);
    positionLightbox();
  }
  function positionLightbox() {
    lightboxEl.style.left = lightbox.x + "px"; lightboxEl.style.top = lightbox.y + "px";
    lightboxEl.style.width = lightbox.w + "px"; lightboxEl.style.height = lightbox.h + "px";
  }
  function focusLightbox(on) { lightboxFocused = !!on; lightboxEl.classList.toggle("focused", lightboxFocused); }
  function setLightbox(on) {
    if (on) {
      if (!lightboxEl.classList.contains("active")) initLightbox();
      activeOverlay = "lightbox"; lightboxEl.classList.add("active"); $("tool-lightbox").classList.add("active"); focusLightbox(true); positionLightbox();
    } else if (activeOverlay === "lightbox" || lightboxEl.classList.contains("active")) {
      if (activeOverlay === "lightbox") activeOverlay = null;
      lightboxEl.classList.remove("active"); $("tool-lightbox").classList.remove("active"); focusLightbox(false);
    }
  }

  function sizeInkCanvasToImage() {
    const rect = pageImage.getBoundingClientRect(), containerRect = imageContainer.getBoundingClientRect();
    const left = rect.left - containerRect.left + imageContainer.scrollLeft;
    const top = rect.top - containerRect.top + imageContainer.scrollTop;
    const width = rect.width, height = rect.height;
    inkCanvas.style.left = left + "px"; inkCanvas.style.top = top + "px";
    inkCanvas.style.width = width + "px"; inkCanvas.style.height = height + "px";
    const ratio = window.devicePixelRatio || 1;
    inkCanvas.width = Math.max(1, Math.round(width * ratio));
    inkCanvas.height = Math.max(1, Math.round(height * ratio));
    inkCtx = inkCanvas.getContext("2d");
    inkCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
    inkCtx.lineCap = "round"; inkCtx.lineJoin = "round"; inkCtx.strokeStyle = "#cc1f4a"; inkCtx.lineWidth = 3;
  }
  function redrawInk() {
    if (!inkCtx) return;
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    for (const stroke of inkHistory) {
      inkCtx.strokeStyle = stroke.color; inkCtx.lineWidth = stroke.width; inkCtx.beginPath();
      stroke.points.forEach((pt, i) => { if (i === 0) inkCtx.moveTo(pt.x, pt.y); else inkCtx.lineTo(pt.x, pt.y); });
      inkCtx.stroke();
    }
  }
  function localPointFromClient(clientX, clientY) {
    const rect = inkCanvas.getBoundingClientRect(); return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function setPenMode(on) { penMode = !!on; inkCanvas.classList.toggle("active", penMode); $("tool-pen").classList.toggle("active", penMode); if (penMode) { sizeInkCanvasToImage(); redrawInk(); } }
  function undoInk() { if (!inkHistory.length) return; inkHistory.pop(); redrawInk(); }

  function detectSmartNavMode() {
    const rect = smartNavEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const dTop = cy, dBottom = window.innerHeight - cy, dLeft = cx, dRight = window.innerWidth - cx;
    const m = Math.min(dTop, dBottom, dLeft, dRight);
    if (m === dTop) return "up"; if (m === dBottom) return "down"; if (m === dLeft) return "left"; return "right";
  }
  function updateSmartNav() {
    const mode = detectSmartNavMode(); smartNavEl.dataset.mode = mode;
    smartNavIconEl.textContent = mode === "up" ? "↑" : mode === "down" ? "↓" : mode === "left" ? "‹" : "›";
    smartNavEl.title = mode === "up" ? "Scroll up" : mode === "down" ? "Scroll down" : mode === "left" ? "Previous page" : "Next page";
  }
  function actSmartNav() {
    const mode = smartNavEl.dataset.mode || "down";
    if (mode === "up") scrollPage(-1); else if (mode === "down") scrollPage(1); else if (mode === "left") loadPage(config.currentPage - 1); else loadPage(config.currentPage + 1);
  }

  function initFromHash() {
    const m = (window.location.hash || "").match(/page=(\d+)/); if (!m) return;
    const visiblePage = parseInt(m[1], 10); if (Number.isNaN(visiblePage)) return;
    const internalIndex = visiblePage - 1 + config.pageOffset;
    if (internalIndex >= 0 && internalIndex < config.pages.length) config.currentPage = internalIndex;
  }
  function initPageCount() { $("total-pages").textContent = String(Math.max(0, config.pages.length - config.pageOffset)); }
  function restoreUiState() { if (localStorage.getItem("tocVisible") === "true") toggleTOC(true); setFitMode(config.currentFitMode); }
  function tryStartPan(clientX, clientY, target) {
    const onCanvas = (target === pageImage || target === imageContainer), onLightbox = !!target.closest(".lightbox");
    if (penMode) return false;
    if (config.zoom > 1 && onCanvas && !onLightbox) {
      config.isPanning = true; config.startX = clientX; config.startY = clientY; config.panStartX = config.translateX; config.panStartY = config.translateY; return true;
    }
    return false;
  }
  function moveLightboxByKey(dx, dy) { lightbox.x += dx; lightbox.y += dy; positionLightbox(); }

  function bindEvents() {
    $("toc-toggle-fixed").onclick = () => toggleTOC();
    $("toc-btn").onclick = () => toggleTOC();
    $("toc-close").onclick = () => toggleTOC(false);
    $("fit-height").onclick = () => setFitMode("height");
    $("fit-width").onclick = () => setFitMode("width");
    $("zoom-in").onclick = () => { config.zoom = Math.min(4, config.zoom + 0.15); updateTransform(); };
    $("zoom-out").onclick = () => { config.zoom = Math.max(0.25, config.zoom - 0.15); updateTransform(); };
    $("copy-link").onclick = copyLink;
    $("fullscreen").onclick = toggleFullscreen;
    $("print-btn").onclick = () => window.print();
    $("pointer-btn").onclick = () => setPointer(!pointerOn);
    $("tool-ruler").onclick = () => { if (rulerEl.classList.contains("active")) setRuler(false); else setRuler(true); };
    $("tool-lightbox").onclick = () => { if (lightboxEl.classList.contains("active")) setLightbox(false); else setLightbox(true); };
    $("tool-pen").onclick = () => setPenMode(!penMode);
    $("tool-clear-ink").onclick = clearInk;
    $("tool-undo").onclick = undoInk;
    $("current-page").onclick = showPageInput;

    imageContainer.addEventListener("mousemove", (e) => positionPointer(e.clientX, e.clientY));
    imageContainer.addEventListener("mouseleave", () => { if (pointerOn) pointerEl.style.display = "none"; });
    imageContainer.addEventListener("mouseenter", () => { if (pointerOn) pointerEl.style.display = "block"; });
    imageContainer.addEventListener("scroll", () => { positionPointer(pointerPos.x, pointerPos.y); if (rulerEl.classList.contains("active")) positionRuler(toolPosY); });

    imageContainer.addEventListener("mousedown", (e) => {
      if (e.target === pageImage || e.target === imageContainer) focusLightbox(false);
      if (activeOverlay === "ruler" && e.target !== inkCanvas && !e.target.closest(".lightbox") && !penMode) {
        toolDragging = true;
        toolPosY = e.clientY - imageContainer.getBoundingClientRect().top + imageContainer.scrollTop;
        positionRuler(toolPosY); return;
      }
      if (tryStartPan(e.clientX, e.clientY, e.target)) e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (toolDragging && rulerEl.classList.contains("active")) {
        toolPosY = e.clientY - imageContainer.getBoundingClientRect().top + imageContainer.scrollTop;
        positionRuler(toolPosY);
      }
      if (config.isPanning) {
        config.translateX = config.panStartX + (e.clientX - config.startX);
        config.translateY = config.panStartY + (e.clientY - config.startY);
        updateTransform();
      }
      if (lbDrag && lbStart) {
        const dx = e.clientX - lbStart.x, dy = e.clientY - lbStart.y, minSize = 60;
        if (lbDrag === "move") { lightbox.x = lbStart.boxX + dx; lightbox.y = lbStart.boxY + dy; }
        else if (lbDrag === "tl") { lightbox.x = lbStart.boxX + dx; lightbox.y = lbStart.boxY + dy; lightbox.w = Math.max(minSize, lbStart.boxW - dx); lightbox.h = Math.max(minSize, lbStart.boxH - dy); }
        else if (lbDrag === "tr") { lightbox.y = lbStart.boxY + dy; lightbox.w = Math.max(minSize, lbStart.boxW + dx); lightbox.h = Math.max(minSize, lbStart.boxH - dy); }
        else if (lbDrag === "bl") { lightbox.x = lbStart.boxX + dx; lightbox.w = Math.max(minSize, lbStart.boxW - dx); lightbox.h = Math.max(minSize, lbStart.boxH + dy); }
        else if (lbDrag === "br") { lightbox.w = Math.max(minSize, lbStart.boxW + dx); lightbox.h = Math.max(minSize, lbStart.boxH + dy); }
        positionLightbox();
      }
      if (smartNavDrag) {
        const dx = e.clientX - smartNavDrag.startX, dy = e.clientY - smartNavDrag.startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) smartNavDrag.moved = true;
        const w = smartNavEl.offsetWidth, h = smartNavEl.offsetHeight;
        const left = clamp(smartNavDrag.left + dx, 8, window.innerWidth - w - 8);
        const top = clamp(smartNavDrag.top + dy, 8, window.innerHeight - h - 8);
        smartNavEl.style.left = (left + w / 2) + "px"; smartNavEl.style.top = (top + h / 2) + "px"; updateSmartNav();
      }
    });

    window.addEventListener("mouseup", () => {
      toolDragging = false; config.isPanning = false; lbDrag = null; lbStart = null;
      if (smartNavDrag) { const moved = smartNavDrag.moved; smartNavDrag = null; smartNavEl.classList.remove("dragging"); if (!moved) actSmartNav(); }
    });

    lightboxEl.addEventListener("mousedown", (e) => {
      e.preventDefault(); e.stopPropagation(); focusLightbox(true);
      const handle = e.target.closest(".lb-handle"); lbDrag = handle ? handle.dataset.corner : "move";
      lbStart = { x: e.clientX, y: e.clientY, boxX: lightbox.x, boxY: lightbox.y, boxW: lightbox.w, boxH: lightbox.h };
    });

    smartNavEl.addEventListener("mousedown", (e) => {
      e.preventDefault(); e.stopPropagation(); const rect = smartNavEl.getBoundingClientRect();
      smartNavDrag = { startX: e.clientX, startY: e.clientY, left: rect.left, top: rect.top, moved: false };
      smartNavEl.classList.add("dragging");
    });

    imageContainer.addEventListener("wheel", (e) => {
      if (e.ctrlKey) { e.preventDefault(); const delta = e.deltaY < 0 ? 0.08 : -0.08; config.zoom = clamp(config.zoom + delta, 0.25, 4); updateTransform(); }
    }, { passive: false });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      if (e.key === "ArrowUp") {
        e.preventDefault(); if (lightboxFocused && lightboxEl.classList.contains("active")) moveLightboxByKey(0, -18); else if (rulerEl.classList.contains("active")) positionRuler(toolPosY - 18); else scrollPage(-1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault(); if (lightboxFocused && lightboxEl.classList.contains("active")) moveLightboxByKey(0, 18); else if (rulerEl.classList.contains("active")) positionRuler(toolPosY + 18); else scrollPage(1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault(); if (lightboxFocused && lightboxEl.classList.contains("active")) moveLightboxByKey(-18, 0); else loadPage(config.currentPage - 1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault(); if (lightboxFocused && lightboxEl.classList.contains("active")) moveLightboxByKey(18, 0); else loadPage(config.currentPage + 1);
      } else if (e.key.toLowerCase() === "t") toggleTOC();
      else if (e.key.toLowerCase() === "p") setPointer(!pointerOn);
      else if (e.key.toLowerCase() === "r") { if (rulerEl.classList.contains("active")) setRuler(false); else setRuler(true); }
      else if (e.key.toLowerCase() === "l") { if (lightboxEl.classList.contains("active")) setLightbox(false); else setLightbox(true); }
    });

    pageImage.addEventListener("load", () => { sizeInkCanvasToImage(); redrawInk(); if (lightboxEl.classList.contains("active")) positionLightbox(); if (pointerOn) positionPointer(pointerPos.x, pointerPos.y); });

    inkCanvas.addEventListener("pointerdown", (e) => {
      if (!penMode) return; e.preventDefault(); sizeInkCanvasToImage();
      const pt = localPointFromClient(e.clientX, e.clientY); const stroke = { color: "#cc1f4a", width: 3, points: [pt] };
      inkHistory.push(stroke); inkDrawing = true; redrawInk(); inkCanvas.setPointerCapture?.(e.pointerId);
    });
    inkCanvas.addEventListener("pointermove", (e) => { if (!penMode || !inkDrawing || !inkHistory.length) return; const pt = localPointFromClient(e.clientX, e.clientY); inkHistory[inkHistory.length - 1].points.push(pt); redrawInk(); });
    inkCanvas.addEventListener("pointerup", () => { inkDrawing = false; });
    inkCanvas.addEventListener("pointercancel", () => { inkDrawing = false; });

    window.addEventListener("resize", () => { sizeInkCanvasToImage(); redrawInk(); updateSmartNav(); if (lightboxEl.classList.contains("active")) positionLightbox(); });
  }

  function init() {
    buildRulerTicks();
    initFromHash();
    initPageCount();
    renderTOC();
    restoreUiState();
    bindEvents();
    loadPage(config.currentPage);
    if (config.toc && config.toc.chapters && config.toc.chapters.length) setTimeout(() => toggleTOC(true), 80);
    updateSmartNav();
  }

  init();
})();
</script>
</body>
</html>
