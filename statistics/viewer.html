<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a1a;
  color: #e8e8e8;
  display: flex;
}
body.toc-hidden .toc-sidebar { margin-left: -320px; }

.toc-sidebar {
  width: 320px;
  flex-shrink: 0;
  background: #222;
  border-right: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: margin-left .22s ease;
  z-index: 1500;
}
.toc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #333;
}
.toc-header h2 { margin: 0; font-size: 14px; }
.toc-close {
  border: 1px solid #444; background: #2d2d2d; color: #ddd;
  border-radius: 4px; width: 30px; height: 30px; cursor: pointer;
}
.toc-content { flex: 1; overflow: auto; padding: 6px; }
.toc-chapter { margin-bottom: 4px; border-radius: 6px; overflow: hidden; }
.toc-chapter-header {
  display: flex; align-items: center; gap: 6px;
  background: #2c2c2c; padding: 7px 8px; cursor: pointer;
}
.toc-chapter-header:hover, .toc-section:hover { background: #343434; }
.chapter-expand {
  width: 12px; color: #a89aff; transition: transform .15s; font-size: 10px;
}
.toc-chapter.expanded .chapter-expand { transform: rotate(90deg); }
.chapter-number { min-width: 32px; color: #a89aff; font-weight: 700; font-size: 11px; }
.toc-chapter-title { font-size: 11px; line-height: 1.3; flex: 1; }
.toc-sections { display: none; background: #252525; }
.toc-chapter.expanded .toc-sections { display: block; }
.toc-section { display: flex; gap: 6px; cursor: pointer; padding: 6px 8px 6px 30px; }
.toc-section.active { background: #3a3a3a; }
.section-number { min-width: 28px; color: #9a9a9a; font-size: 10px; }
.toc-no-data { color: #8f8f8f; padding: 16px; font-size: 12px; }

.viewer {
  flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative;
}

.controls {
  height: 42px; min-height: 42px;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  background: #222; border-bottom: 1px solid #333;
  z-index: 1000;
}
.controls-left, .controls-right { display: flex; align-items: center; gap: 6px; }
.controls-right { margin-left: auto; }
.toolbar-btn {
  border: 1px solid #444; background: #303030; color: #e8e8e8;
  border-radius: 6px; min-width: 32px; height: 30px; padding: 0 8px; cursor: pointer;
}
.toolbar-btn:hover { background: #3a3a3a; }
.toolbar-btn.active { background: #7f5cff; border-color: #9b87ff; color: #fff; }
.sep { width: 1px; height: 18px; background: #444; }
.page-info { display: flex; align-items: center; gap: 3px; font-size: 12px; }
#current-page { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
#current-page:hover { background: #393939; }
.page-input-inline {
  width: 60px; padding: 3px 4px; text-align: center;
  border: 1px solid #7f5cff; border-radius: 4px; background: #181818; color: #fff;
}
.calculator-launch{margin-left:5px;font-size:12px;font-weight:600;white-space:nowrap}

.image-container {
  position: relative; flex: 1; overflow: auto; background: #1a1a1a; touch-action: none;
}
.image-container.fit-height { display: flex; align-items: center; justify-content: center; }
.image-container.fit-height #page-image {
  height: 100%; width: auto; max-width: 100%; object-fit: contain;
}
.image-container.fit-width #page-image {
  width: 100%; height: auto; object-fit: contain;
}
#page-image {
  display: block;
  transform-origin: 50% 50%;
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
  user-select: none; -webkit-user-drag: none;
}
.zoom-indicator {
  position: absolute; right: 12px; bottom: 12px;
  background: rgba(0,0,0,.65); color: #fff; border-radius: 4px;
  padding: 4px 8px; font-size: 11px; display: none; z-index: 900;
}

/* Pointer */
.teacher-pointer {
  position: absolute;
  width: 84px; height: 84px;
  display: none; pointer-events: none; z-index: 1300;
  transform: translate(-20px,-20px);
}
.teacher-pointer svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(123,68,255,.45)); }
.teacher-pointer.active { display: block; }

/* Ink */
#ink-layer {
  position: absolute; inset: 0; z-index: 1200; display: none; touch-action: none;
}
#ink-layer.active { display: block; cursor: crosshair; }

/* Ruler */
.reading-ruler {
  position: absolute; left: 0; width: 100%; height: 54px;
  display: none; z-index: 1100; pointer-events: none;
}
.reading-ruler.active { display: block; }
.ruler-bar {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent 3px, rgba(120,75,0,.06) 3px, rgba(120,75,0,.06) 6px),
    linear-gradient(180deg, #dbb46f 0%, #d3a95d 10%, #c89745 45%, #c2913c 55%, #d0a65b 90%, #d9b46f 100%);
  border-top: 1px solid #8b6914;
  border-bottom: 2px solid #6f5210;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.ruler-edge { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(180deg, #9b7420, #7b5c16); }
.ruler-ticks { position: absolute; left: 0; right: 0; bottom: 6px; height: 20px; }
.ruler-tick { position: absolute; bottom: 0; width: 1px; background: #66480f; }
.ruler-tick.cm { height: 16px; width: 1.5px; }
.ruler-tick.half { height: 10px; }
.ruler-tick.mm { height: 6px; opacity: .7; }
.ruler-tick-label { position: absolute; bottom: 21px; transform: translateX(-50%); font-size: 8px; color: #5b3f0b; font-weight: 700; }

/* Lightbox */
.lightbox {
  position: absolute; display: none; z-index: 1000;
  border: 2px solid rgba(255,220,100,.65);
  border-radius: 6px;
  box-shadow: 0 0 0 4000px rgba(0,0,0,.38);
  touch-action: none; cursor: move;
}
.lightbox.active { display: block; }
.lightbox.focused { border-color: rgba(255,220,100,.95); }
.lb-handle {
  position: absolute; width: 22px; height: 22px;
  background: rgba(255,220,100,.82); border: 1px solid rgba(170,130,25,.9);
  border-radius: 4px; z-index: 1001; touch-action: none;
}
.lb-handle.tl { top: -8px; left: -8px; cursor: nw-resize; }
.lb-handle.tr { top: -8px; right: -8px; cursor: ne-resize; }
.lb-handle.bl { bottom: -8px; left: -8px; cursor: sw-resize; }
.lb-handle.br { bottom: -8px; right: -8px; cursor: se-resize; }

/* Two page arrows, vertically centred in the viewing area */
.page-nav{
 position:absolute;left:0;right:0;top:42px;bottom:0;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 8px;pointer-events:none;z-index:2100;
}
.page-nav.hidden{display:none}
.page-nav button{
 width:48px;height:64px;flex:none;
 border:0;border-radius:0;
 background:transparent;color:#909090;
 box-shadow:none;text-shadow:0 0 2px rgba(255,255,255,.65);
 font-size:44px;font-weight:400;line-height:1;
 cursor:pointer;touch-action:manipulation;pointer-events:auto;
}
.page-nav button:hover,.page-nav button:focus-visible{background:transparent;color:#666}
.page-nav button:active{background:transparent;color:#555}
.page-nav button:disabled{opacity:.24;cursor:default}

/* Compact, in-page calculator — the book remains open behind it */
.calculator-panel{
 position:fixed;z-index:2500;top:52px;right:12px;
 width:min(478px,calc(100vw - 24px));
 height:min(690px,calc(100dvh - 64px));
 min-width:min(330px,calc(100vw - 24px));min-height:290px;
 display:flex;flex-direction:column;overflow:hidden;resize:both;
 border:1px solid #555;border-radius:11px;background:#f2f2f2;
 box-shadow:0 10px 36px rgba(0,0,0,.4);
}
.calculator-panel[hidden]{display:none}
.calculator-panel-header{
 display:flex;align-items:center;gap:9px;justify-content:space-between;
 height:38px;min-height:38px;padding:0 8px 0 13px;
 background:#252525;color:#e9e9e9;cursor:move;touch-action:none;
 font-size:13px;font-weight:600;user-select:none;
}
.calculator-panel-header button{
 min-width:30px;min-height:29px;border:1px solid #515151;border-radius:5px;
 background:#303030;color:#fff;font-size:19px;cursor:pointer;
}
.calculator-panel-header button:hover{background:#484848}
.calculator-panel iframe{flex:1;display:block;min-height:0;width:100%;border:0;background:#efefef}
@media(max-width:520px){.calculator-panel{right:6px;top:49px;width:calc(100vw - 12px);height:min(680px,calc(100dvh - 58px));min-width:0}}

/* Print dialog */
.print-range-dialog {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  z-index: 3000; background: rgba(0,0,0,.5);
}
.print-range-dialog.open { display: flex; }
.print-card {
  width: min(360px,92vw); background: #222; border: 1px solid #444;
  border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.print-card h3 { margin: 0 0 12px; font-size: 16px; }
.print-row { display: flex; gap: 12px; margin-bottom: 12px; }
.print-field { flex: 1; }
.print-field label { display: block; font-size: 12px; color: #bbb; margin-bottom: 4px; }
.print-field input {
  width: 100%; padding: 8px; border-radius: 6px;
  border: 1px solid #555; background: #171717; color: #fff;
}
.print-actions { display: flex; justify-content: flex-end; gap: 8px; }
.print-actions button {
  border: 1px solid #555; background: #303030; color: #fff;
  border-radius: 6px; height: 34px; padding: 0 12px; cursor: pointer;

.print-actions button.primary { background: #7f5cff; border-color: #9b87ff; }

@media print {
  .toc-sidebar,.controls,.smart-nav,.teacher-pointer,#ink-layer,.reading-ruler,.lightbox,.zoom-indicator,.print-range-dialog,.calculator-panel {
    display:none!important;
  }
  html,body{overflow:visible!important;background:#fff!important}
  .viewer,.image-container{overflow:visible!important;display:block!important}
  #page-image{width:100%!important;height:auto!important;transform:none!important;box-shadow:none!important}
}

@media (max-width:700px) {
  .toc-sidebar{width:270px}

  .page-nav{padding:0 5px}
  .page-nav button{width:42px;height:58px;font-size:40px}
  .calculator-launch{font-size:12px;padding:0 6px}
}

// Load the user's calculator within a compact panel; do not alter the standalone app.
function initCalculatorPanel(){
 const panel=$("calculator-panel"),frame=$("calculator-frame"),launch=$("calculator-toggle");
 const dragBar=$("calculator-drag-bar");
 let drag=null,scaledDoc=null;
 function showCalculator(on){
  panel.hidden=!on;
  launch.classList.toggle("active",on);
  launch.setAttribute("aria-expanded",on?"true":"false");
  if(on&&!frame.getAttribute("src"))frame.src="https://ronandownes.github.io/calculator/";
  if(on)fitCalculator();
 }
 function fitCalculator(){
  if(!scaledDoc||panel.hidden)return;
  try{
   const doc=frame.contentDocument;
   if(doc!==scaledDoc)return;
   doc.documentElement.style.zoom="1";
   const height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
   const factor=Math.min(1,Math.max(.72,(frame.clientHeight-12)/Math.max(1,height)));
   doc.documentElement.style.zoom=String(factor);
  }catch(e){/* Native iframe scrolling remains available. */}
 }
 frame.addEventListener("load",()=>{
  try{
   const doc=frame.contentDocument;
   if(!doc)return; // Fallback: the standalone website is still displayed in the iframe.
   const style=doc.createElement("style");
   style.id="gallery-compact-embed";
   style.textContent=`
    html{overflow-x:hidden!important}
    body{padding:6px 5px 10px!important;overflow-x:hidden!important}
    .layout{display:block!important;max-width:540px!important;margin:0 auto!important}
    .calculator{width:100%!important;max-width:540px!important;min-width:0!important}
    .side{display:none!important}
    .theme-switch{margin:0 auto 5px!important;padding:4px 5px!important}
   `;
   doc.head.appendChild(style);
   scaledDoc=doc;
   fitCalculator();
  }catch(e){/* If framing access is restricted, preserve the working calculator. */}
 });
 launch.addEventListener("click",()=>showCalculator(panel.hidden));
 $("calculator-close").addEventListener("click",()=>showCalculator(false));
 window.addEventListener("keydown",e=>{if(e.key==="Escape"&&!panel.hidden)showCalculator(false)});
 dragBar.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  const rect=panel.getBoundingClientRect();
  drag={pointerId:e.pointerId,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top};
  dragBar.setPointerCapture(e.pointerId);e.preventDefault();
 });
 dragBar.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pointerId)return;
  const x=clamp(e.clientX-drag.offsetX,0,Math.max(0,window.innerWidth-panel.offsetWidth));
  const y=clamp(e.clientY-drag.offsetY,0,Math.max(0,window.innerHeight-panel.offsetHeight));
  panel.style.left=x+"px";panel.style.top=y+"px";panel.style.right="auto";

 dragBar.addEventListener("pointerup",stopDrag);
 dragBar.addEventListener("pointercancel",stopDrag);
 dragBar.addEventListener("lostpointercapture",stopDrag);
 if("ResizeObserver" in window)new ResizeObserver(()=>fitCalculator()).observe(frame);
 window.addEventListener("resize",()=>fitCalculator());
}

// Touch gestures: page pan/pinch, touch ruler, movable and pinch-resizable spotlight.
const touches=new Map();
let pinchDistance=0,pinchCentre=null,spotlightPinch=null;
function touchPair(){
 const p=Array.from(touches.values()).slice(0,2);
 if(p.length<2)return null;

  d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),
  x:(p[0].x+p[1].x)/2,
  y:(p[0].y+p[1].y)/2,

function touchEnd(e){
 if(!touches.has(e.pointerId))return;

}
function moveSpotlightByTouch(mode,dx,dy){

  const shiftX=Math.min(dx,lightbox.w-minW),shiftY=Math.min(dy,lightbox.h-minH);
  lightbox.x+=shiftX;lightbox.y+=shiftY;
  lightbox.w-=shiftX;lightbox.h-=shiftY;
 }else if(mode==="tr"){
  lightbox.w=Math.max(minW,lightbox.w+dx);
  const shiftY=Math.min(dy,lightbox.h-minH);
  lightbox.y+=shiftY;lightbox.h-=shiftY;
 }else if(mode==="bl"){
  const shiftX=Math.min(dx,lightbox.w-minW);
  lightbox.x+=shiftX;lightbox.w-=shiftX;
  lightbox.h=Math.max(minH,lightbox.h+dy);
 }else if(mode==="br"){
  lightbox.w=Math.max(minW,lightbox.w+dx);
  lightbox.h=Math.max(minH,lightbox.h+dy);

}

   (rulerEl.classList.contains("active")?"ruler":"page");

window.addEventListener("keydown",e=>{if(document.activeElement&&document.activeElement.tagName==="INPUT")return;if(e.key==="ArrowUp"){e.preventDefault();if(lightboxFocused&&lightboxEl.classList.contains("active"))moveLightboxByKey(0,-18);else if(rulerEl.classList.contains("active"))positionRuler(toolPosY-18);else scrollPage(-1)}else if(e.key==="ArrowDown"){e.preventDefault();if(lightboxFocused&&lightboxEl.classList.contains("active"))moveLightboxByKey(0,18);else if(rulerEl.classList.contains("active"))positionRuler(toolPosY+18);else scrollPage(1)}else if(e.key==="ArrowLeft"){e.preventDefault();if(lightboxFocused&&lightboxEl.classList.contains("active"))moveLightboxByKey(-18,0);else loadPage(config.currentPage-1)}else if(e.key==="ArrowRight"){e.preventDefault();if(lightboxFocused&&lightboxEl.classList.contains("active"))moveLightboxByKey(18,0);else loadPage(config.currentPage+1)}else if(e.key.toLowerCase()==="t"){toggleTOC()}else if(e.key.toLowerCase()==="p"){setPointer(!pointerOn)}else if(e.key.toLowerCase()==="r"){if(rulerEl.classList.contains("active"))setRuler(false);else setRuler(true)}else if(e.key.toLowerCase()==="l"){if(lightboxEl.classList.contains("active"))setLightbox(false);else setLightbox(true)}else if(e.key.toLowerCase()==="n"){setSmartNavVisible(smartNavEl.classList.contains("hidden"))}else if(e.key==="Escape"){closePrintDialog()}});
pageImage.addEventListener("load",()=>{sizeInkCanvasToImage();redrawInk();if(lightboxEl.classList.contains("active"))positionLightbox();if(pointerOn)positionPointer(pointerPos.x,pointerPos.y);ensureSmartNavVisible();updateSmartNav()});
inkCanvas.addEventListener("pointerdown",e=>{if(!penMode)return;e.preventDefault();sizeInkCanvasToImage();const pt=localPointFromClient(e.clientX,e.clientY,inkCanvas);const stroke={color:window.galleryPenColour||"#111111",width:3,points:[pt]};inkHistory.push(stroke);inkDrawing=true;redrawInk();inkCanvas.setPointerCapture&&inkCanvas.setPointerCapture(e.pointerId)});
inkCanvas.addEventListener("pointermove",e=>{if(!penMode||!inkDrawing||!inkHistory.length)return;const pt=localPointFromClient(e.clientX,e.clientY,inkCanvas);inkHistory[inkHistory.length-1].points.push(pt);redrawInk()});
inkCanvas.addEventListener("pointerup",()=>{inkDrawing=false});inkCanvas.addEventListener("pointercancel",()=>{inkDrawing=false});
window.addEventListener("resize",()=>{sizeInkCanvasToImage();redrawInk();ensureSmartNavVisible();updateSmartNav();if(lightboxEl.classList.contains("active"))positionLightbox()});
$("print-range-dialog").addEventListener("click",e=>{if(e.target.id==="print-range-dialog")closePrintDialog()});
}
function init(){initCalculatorPanel();buildRulerTicks();initFromHash();initPageCount();renderTOC();restoreUiState();bindEvents();ensureSmartNavVisible();loadPage(config.currentPage);if(config.toc&&config.toc.chapters&&config.toc.chapters.length){setTimeout(()=>toggleTOC(true),80)}updateSmartNav()}
init();
})();
</script>
